<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Wave of Hormuz — panel (14 HP = 71.12 × 128.5 mm)

  Waveform: single cycle, data-accurate dual-closure square wave.
    OPEN = HIGH (+1),  CLOSED = LOW (−1)
    947-day timeline (Oct 7 2023 – May 11 2026):
      Phase 0.0000 – 0.1996  (189 days)  OPEN
      Phase 0.1996 – 0.2228  ( 22 days)  CLOSED — MSC Aries seizure (Apr–May 2024) [C1]
      Phase 0.2228 – 0.9261  (666 days)  OPEN
      Phase 0.9261 – 1.0000  ( 70 days)  CLOSED — renewed blockade (Mar 2026–present) [C2]

    Display box x=3.5–67.6 (64.1 mm wide), phase→x = 3.5 + phase×64.1
      C1 start x=16.30  C1 end x=17.78  (1.48 mm wide — accurate, not exaggerated)
      C2 start x=62.87  C2 end x=67.60  (4.73 mm wide — ongoing)

  4-column knob layout:
    Columns x: 14.22, 28.44, 42.67, 56.89 mm   Centre: 35.56 mm

  I/O:  6 inputs  x: 7.62 18.80 29.98 41.16 52.34 63.50  y=110
        4 outputs x: 14.22 28.44 42.67 56.89              y=121

  Colour palette:
    #0e1f2e / #07121b  panel gradient
    #06101a            side rails
    #0d2435            title / section tint
    #e8c034            gold  (title, waveform line)
    #3aa898            teal  (accent, PASSAGE label)
    #8ecfcf            light teal  (primary knob labels)
    #5a8a9a            muted teal  (secondary labels, jack labels)
    #3a6878            dim teal  (range / sub labels)
    #2a5060            knob halo border
    #c03030            red  (closure fills)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="71.12mm" height="128.5mm"
     viewBox="0 0 71.12 128.5">

  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="128.5"
        gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0e1f2e"/>
      <stop offset="100%" stop-color="#07121b"/>
    </linearGradient>
  </defs>

  <!-- ── Background ──────────────────────────────────────────────────────── -->
  <rect width="71.12" height="128.5" fill="url(#panelBg)"/>
  <rect x="0"     y="0" width="2.0" height="128.5" fill="#06101a"/>
  <rect x="69.12" y="0" width="2.0" height="128.5" fill="#06101a"/>

  <!-- ── Title area ───────────────────────────────────────────────────────── -->
  <rect x="2.0" y="0" width="67.12" height="17.5" fill="#0d2435" rx="0.3"/>

  <text x="35.56" y="6.2" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="3.2" font-weight="bold"
        fill="#e8c034" letter-spacing="0.4">THE WAVE OF HORMUZ</text>

  <!-- ── Waveform display — single cycle, data-accurate ──────────────────── -->
  <!--
    Background box
  -->
  <rect x="3.5" y="8.5" width="64.1" height="7.0" fill="#060f18" rx="0.4"/>

  <!-- Floor reference -->
  <line x1="3.5" y1="15.0" x2="67.6" y2="15.0"
        stroke="#1c3545" stroke-width="0.25"/>

  <!-- OPEN fills: teal -->
  <rect x="3.50"  y="9.2" width="12.80" height="5.8" fill="#3aa898" opacity="0.18"/>
  <rect x="17.78" y="9.2" width="45.09" height="5.8" fill="#3aa898" opacity="0.18"/>

  <!-- CLOSED fills: red  (C1 is a hairline at 1.48 mm; C2 is the right-side block) -->
  <rect x="16.30" y="9.2" width="1.48"  height="5.8" fill="#c03030" opacity="0.50"/>
  <rect x="62.87" y="9.2" width="4.73"  height="5.8" fill="#c03030" opacity="0.40"/>

  <!-- Waveform polyline — gold, data-accurate single cycle -->
  <polyline
    points="3.50,9.2  16.30,9.2  16.30,15.0  17.78,15.0  17.78,9.2
             62.87,9.2  62.87,15.0  67.60,15.0"
    stroke="#e8c034" stroke-width="0.65" fill="none" stroke-linejoin="miter"/>

  <!-- Vertical tick markers at closure edges -->
  <line x1="16.30" y1="8.5" x2="16.30" y2="15.8"
        stroke="#c03030" stroke-width="0.30" stroke-dasharray="0.5,0.4"/>
  <line x1="17.78" y1="8.5" x2="17.78" y2="15.8"
        stroke="#5a8a9a" stroke-width="0.25" stroke-dasharray="0.4,0.4"/>
  <line x1="62.87" y1="8.5" x2="62.87" y2="15.8"
        stroke="#c03030" stroke-width="0.35" stroke-dasharray="0.6,0.5"/>

  <!-- C1 / C2 annotation labels (SVG text — for preview tools; VCV drops text) -->
  <text x="14.0"  y="8.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#c07070">C1</text>
  <text x="65.24" y="8.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#c07070">C2</text>

  <!-- Decorative wave divider under title area -->
  <path d="M2,17.5 C8,15.2 13,19.5 18,17.5 C23,15.2 28,19.5 33,17.5
           C38,15.2 43,19.5 48,17.5 C53,15.2 58,19.5 63,17.5
           C67,15.2 70,19.5 69.1,17.5"
        stroke="#3aa898" stroke-width="0.7" fill="none" opacity="0.75"/>

  <!-- ── KNOT SPEED (large knob, centred at 35.56) ───────────────────────── -->
  <circle cx="35.56" cy="25.0" r="8.0"
          fill="#0c1e2c" stroke="#2a5060" stroke-width="0.8"/>

  <text x="35.56" y="19.3" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.5" font-weight="bold" fill="#8ecfcf">KNOT SPEED</text>
  <text x="13.0" y="25.6" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#3a6878">&#x2212;4<tspan font-size="1.4">OCT</tspan></text>
  <text x="58.1" y="25.6" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#3a6878">+4<tspan font-size="1.4">OCT</tspan></text>

  <!-- Divider -->
  <line x1="4" y1="33.5" x2="67.1" y2="33.5" stroke="#1c3a4a" stroke-width="0.5"/>

  <!-- ── CLOSURE WINDOWS ROW  y=47 ────────────────────────────────────────── -->
  <!--  OPENING CEREMONY | STRAIT JACKET | SANCTIONS | EMBARGO  -->

  <text x="35.56" y="36.8" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.7" fill="#3a6878" letter-spacing="0.3">&#x2014; CLOSURE WINDOWS &#x2014;</text>

  <!-- knob halos -->
  <circle cx="14.22" cy="47.0" r="5.2" fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>
  <circle cx="28.44" cy="47.0" r="5.2" fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>
  <circle cx="42.67" cy="47.0" r="5.2" fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>
  <circle cx="56.89" cy="47.0" r="5.2" fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>

  <!-- labels above knobs -->
  <text x="14.22" y="39.2" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">OPENING</text>
  <text x="14.22" y="42.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">CEREMONY</text>

  <text x="28.44" y="39.2" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">STRAIT</text>
  <text x="28.44" y="42.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">JACKET</text>

  <text x="42.67" y="40.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">SANCTIONS</text>

  <text x="56.89" y="40.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">EMBARGO</text>

  <!-- sub-labels below knobs -->
  <text x="14.22" y="54.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#5a8a9a">c1 start</text>
  <text x="28.44" y="54.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#5a8a9a">c1 width</text>
  <text x="42.67" y="54.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#5a8a9a">c2 start</text>
  <text x="56.89" y="54.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#5a8a9a">c2 width</text>

  <!-- Divider -->
  <line x1="4" y1="57.5" x2="67.1" y2="57.5" stroke="#1c3a4a" stroke-width="0.5"/>

  <!-- ── EFFECTS ROW  y=71 ─────────────────────────────────────────────────── -->
  <!--  OIL SLICK | CHOKE POINT | PERSIAN TILT | TANKER  -->

  <!-- knob halos -->
  <circle cx="14.22" cy="71.0" r="5.2" fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>
  <circle cx="28.44" cy="71.0" r="5.2" fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>
  <circle cx="42.67" cy="71.0" r="5.2" fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>
  <circle cx="56.89" cy="71.0" r="5.2" fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>

  <!-- labels above knobs -->
  <text x="14.22" y="60.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">OIL SLICK</text>

  <text x="28.44" y="60.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">CHOKE</text>
  <text x="28.44" y="62.8" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">POINT</text>

  <text x="42.67" y="60.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">PERSIAN</text>
  <text x="42.67" y="62.8" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">TILT</text>

  <text x="56.89" y="60.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.1" font-weight="bold" fill="#8ecfcf">TANKER</text>

  <!-- sub-labels below knobs -->
  <text x="14.22" y="78.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#5a8a9a">slew / LP</text>
  <text x="28.44" y="78.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#5a8a9a">tanh drive</text>
  <text x="42.67" y="78.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#5a8a9a">saw &#x00AB; tri</text>
  <text x="56.89" y="78.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#5a8a9a">amplitude</text>

  <!-- Divider -->
  <line x1="4" y1="81.0" x2="67.1" y2="81.0" stroke="#1c3a4a" stroke-width="0.5"/>

  <!-- ── GULF / DRY (small knob, centred) ─────────────────────────────────── -->
  <circle cx="35.56" cy="93.0" r="3.8"
          fill="#0c1e2c" stroke="#2a5060" stroke-width="0.6"/>

  <text x="35.56" y="84.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.3" font-weight="bold" fill="#8ecfcf">GULF / DRY</text>
  <text x="20.5" y="93.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#3a6878">DRY</text>
  <text x="50.6" y="93.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="1.8" fill="#3a6878">WET</text>

  <!-- Divider -->
  <line x1="4" y1="100.0" x2="67.1" y2="100.0" stroke="#1c3a4a" stroke-width="0.5"/>

  <!-- ── I/O Section ───────────────────────────────────────────────────────── -->
  <rect x="2.0" y="103.0" width="67.12" height="25.5" fill="#070e18" rx="0.3"/>
  <line x1="2.0" y1="103.0" x2="69.12" y2="103.0"
        stroke="#3aa898" stroke-width="0.6" opacity="0.8"/>

  <!-- Input jack halos  (6 inputs, y=110)
       x: 7.62, 18.80, 29.98, 41.16, 52.34, 63.50  -->
  <circle cx=" 7.62" cy="110" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>
  <circle cx="18.80" cy="110" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>
  <circle cx="29.98" cy="110" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>
  <circle cx="41.16" cy="110" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>
  <circle cx="52.34" cy="110" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>
  <circle cx="63.50" cy="110" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>

  <!-- Output jack halos  (4 outputs, y=121)
       x: 14.22, 28.44, 42.67, 56.89  -->
  <circle cx="14.22" cy="121" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>
  <circle cx="28.44" cy="121" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>
  <circle cx="42.67" cy="121" r="2.8" fill="#0c1e2c" stroke="#1e4050" stroke-width="0.5"/>
  <circle cx="56.89" cy="121" r="3.0" fill="#0c1e2c" stroke="#2a6050" stroke-width="0.8"/>

  <!-- Input labels (above jacks, y=106.5) -->
  <text x=" 7.62" y="106.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">V/OCT</text>
  <text x="18.80" y="106.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">TIDE</text>
  <text x="29.98" y="106.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">SWELL</text>
  <text x="41.16" y="106.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">OPEN</text>
  <text x="52.34" y="106.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">LOCK</text>
  <text x="63.50" y="106.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">TILT</text>

  <!-- Input sub-labels (below jacks, y=115) -->
  <text x=" 7.62" y="115.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">pitch</text>
  <text x="18.80" y="115.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">sync</text>
  <text x="29.98" y="115.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">fm</text>
  <text x="41.16" y="115.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">c1 cv</text>
  <text x="52.34" y="115.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">c2 cv</text>
  <text x="63.50" y="115.0" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">shp cv</text>

  <!-- Output secondary labels (above output jacks, y=117.5) -->
  <text x="14.22" y="117.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">trig</text>
  <text x="28.44" y="117.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">gate</text>
  <text x="42.67" y="117.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">gate</text>
  <text x="56.89" y="117.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="1.6" fill="#3a6878">audio</text>

  <!-- Output primary labels (below output jacks, y=125.5) -->
  <text x="14.22" y="125.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">EOC</text>
  <text x="28.44" y="125.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">C1</text>
  <text x="42.67" y="125.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="2.0" fill="#5a8a9a">C2</text>
  <text x="56.89" y="125.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="2.2" font-weight="bold" fill="#3aa898">PASSAGE</text>

  <!-- Subtle bottom wave decoration -->
  <path d="M2,126.5 C8,124.5 13,128 18,126.5 C23,124.5 28,128 33,126.5
           C38,124.5 43,128 48,126.5 C53,124.5 58,128 63,126.5
           C67,124.5 70,128 69.1,126.5"
        stroke="#3aa898" stroke-width="0.4" fill="none" opacity="0.35"/>

</svg>
